name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: forge build --root contracts
      - run: pnpm --filter agents gen-abi && pnpm --filter agents gen-fixtures
      - run: forge test --root contracts -vv
      - run: pnpm --filter agents typecheck
      - run: pnpm --filter agents test
      - run: pnpm --filter agents e2e
