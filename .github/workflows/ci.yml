name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      # pnpm version comes from package.json "packageManager"; do not also pass `version` here.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: No secrets in tracked files or dashboard
        run: ./scripts/check-no-secrets.sh
      - name: Build contracts and regenerate ABI + cross-language fixtures
        run: |
          forge build --root contracts
          pnpm --filter agents gen-abi
          pnpm --filter agents gen-fixtures
      - name: Solidity tests (unit, fuzz, TS<->Solidity fixtures)
        run: forge test --root contracts -vv
      - name: TypeScript typecheck + unit tests
        run: |
          pnpm --filter agents typecheck
          pnpm --filter agents test
      - name: End-to-end on anvil (4 stories, mock models)
        run: pnpm --filter agents e2e
